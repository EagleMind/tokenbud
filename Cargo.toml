[workspace]
resolver = "2"
members = [
    "crates/tokenbud-core",
    "apps/tokenbud-host",
    "apps/tokenbud-client",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokenbud-core = { path = "crates/tokenbud-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["signal", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
directories = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = "thin"
