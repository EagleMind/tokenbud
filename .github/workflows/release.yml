# Builds the desktop app for Windows, macOS and Linux, and attaches the installers to one draft
# GitHub release. Trigger: push a version tag (git tag v0.1.0 && git push origin v0.1.0), or run it
# by hand from the Actions tab (that makes a "draft-<run>" release). Review the draft, then publish it.
#
# The builds are unsigned: Windows SmartScreen and macOS Gatekeeper will warn on first launch.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release build per tag at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('draft-{0}', github.run_number) }}

jobs:
  create-release:
    name: Create the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The tag must match the version in Cargo.toml, and be plain numbers: Windows installers
      # (MSI) can't carry a pre-release version like 0.2.0-beta.1.
      - name: Check the version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match the version in Cargo.toml ($version)."
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version $version must be MAJOR.MINOR.PATCH for the Windows installer."
            exit 1
          fi

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --draft --title "tokenbud $TAG" --generate-notes --target "$GITHUB_SHA"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS (Apple Silicon)
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            runner: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # `tauri build` runs the frontend build itself (beforeBuildCommand in apps/desktop/tauri.conf.json).
      - name: Build installers
        working-directory: desktop
        run: npm run bundle -- --target ${{ matrix.target }}

      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          dir=target/${{ matrix.target }}/release/bundle
          files=($dir/msi/*.msi $dir/nsis/*.exe $dir/dmg/*.dmg $dir/deb/*.deb $dir/rpm/*.rpm $dir/appimage/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installers found in $dir."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
